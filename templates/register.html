{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="flex justify-center py-8">
    <form method="post" class="w-full max-w-3xl rounded-3xl border border-white/10 bg-slate-900/70 p-8 shadow-2xl shadow-slate-950/40">
        <h1 class="text-3xl font-semibold tracking-tight text-white">Create account</h1>
        <p class="mt-2 text-sm text-slate-400">Set up your operator account for the chat widget management portal.</p>

        <div class="mt-8 grid gap-5 md:grid-cols-2">
            <div>
                <label class="text-sm font-medium text-slate-200">First name</label>
                <input type="text" name="first_name" required class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
            <div>
                <label class="text-sm font-medium text-slate-200">Last name</label>
                <input type="text" name="last_name" required class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
            <div>
                <label class="text-sm font-medium text-slate-200">Email</label>
                <input type="email" name="email" required class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
            <div>
                <label class="text-sm font-medium text-slate-200">Phone</label>
                <input type="text" name="phone" class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
            <div class="md:col-span-2">
                <label class="text-sm font-medium text-slate-200">Company</label>
                <input type="text" name="company" class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
            <div>
                <label class="text-sm font-medium text-slate-200">Password</label>
                <input type="password" name="password" required class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
            <div>
                <label class="text-sm font-medium text-slate-200">Confirm password</label>
                <input type="password" name="confirm_password" required class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
        </div>

        <div class="mt-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <button type="submit" class="inline-flex items-center justify-center rounded-2xl bg-blue-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-400">Register</button>
            <p class="text-sm text-slate-400">Already registered? <a href="{{ url_for('login') }}" class="font-medium text-blue-300 hover:text-blue-200">Login here</a>.</p>
        </div>
    </form>
</section>
{% endblock %}
