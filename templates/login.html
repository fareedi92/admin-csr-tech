{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="flex justify-center py-8">
    <form method="post" class="w-full max-w-xl rounded-3xl border border-white/10 bg-slate-900/70 p-8 shadow-2xl shadow-slate-950/40">
        <h1 class="text-3xl font-semibold tracking-tight text-white">Login</h1>
        <p class="mt-2 text-sm text-slate-400">Sign in to manage businesses, logs, testing, and database tools.</p>
        <input type="hidden" name="next" value="{{ next_url or '' }}">

        <div class="mt-8 space-y-5">
            <div>
                <label class="text-sm font-medium text-slate-200">Email</label>
                <input type="email" name="email" required class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
            <div>
                <label class="text-sm font-medium text-slate-200">Password</label>
                <input type="password" name="password" required class="mt-2 block w-full rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-blue-400/60 focus:ring-2 focus:ring-blue-400/20">
            </div>
        </div>

        <div class="mt-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <button type="submit" class="inline-flex items-center justify-center rounded-2xl bg-blue-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-400">Login</button>
            <p class="text-sm text-slate-400">Need an account? <a href="{{ url_for('register') }}" class="font-medium text-blue-300 hover:text-blue-200">Register here</a>.</p>
        </div>
    </form>
</section>
{% endblock %}
