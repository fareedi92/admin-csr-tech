<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSR Password Help</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-yellow-50 px-6 py-12 font-sans text-black sm:px-12">
    <main class="mx-auto flex min-h-[calc(100vh-6rem)] max-w-md items-center">
        <section class="w-full rounded-2xl border border-amber-200 bg-white p-7 shadow-sm sm:p-9">
            <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-yellow-100 text-amber-700"><i class="fa-solid fa-key"></i></span>
            <h1 class="mt-5 text-2xl font-extrabold">Password help</h1>
            <p class="mt-2 text-sm leading-relaxed text-gray-600">CSR accounts are created and managed by an administrator. Please contact your administrator to reset your password.</p>
            <p class="mt-4 rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-sm text-blue-900"><i class="fa-solid fa-shield-halved mr-2 text-blue-600"></i>Your administrator can update your password from the CSR Management page.</p>
            <a href="{{ url_for('csr_login') }}" class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-yellow-400 py-3 text-sm font-semibold text-black transition hover:bg-amber-500"><i class="fa-solid fa-arrow-left text-xs"></i> Back to CSR login</a>
        </section>
    </main>
</body>
</html>
