<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ business.name }} CSR Widget Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-6 text-slate-900 sm:p-8">
    <div class="mx-auto max-w-6xl rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70">
        <h1 class="text-3xl font-semibold tracking-tight text-slate-900">{{ business.name }} CSR widget preview</h1>
        <p class="mt-3 text-sm text-slate-600">CSR key: <code class="rounded-lg bg-blue-50 px-2 py-1 font-mono text-xs text-blue-700">{{ csr_business.csr_widget_key }}</code></p>
        <p class="mt-2 text-sm text-slate-600">Primary color: <code class="rounded-lg bg-blue-50 px-2 py-1 font-mono text-xs text-blue-700">{{ csr_business.primary_color }}</code></p>
        <div id="csr-console" class="mt-6 min-h-[720px] h-[80vh]"></div>
    </div>

    <script>
        window.CSRDashboardWidgetConfig = {
            baseUrl: {{ app_base_url|tojson }},
            csrKey: {{ csr_business.csr_widget_key|tojson }},
            containerId: "csr-console",
            primaryColor: {{ csr_business.primary_color|tojson }},
            chatListPoll: {{ csr_business.chat_list_poll or 5000 }},
            messagePoll: {{ csr_business.message_poll or 3000 }},
            autoActivate: {{ csr_business.auto_activate | tojson }}
        };
    </script>
    <script src="{{ url_for('widget_assets', filename='csr-dashboard-widget.js') }}"></script>
</body>
</html>
